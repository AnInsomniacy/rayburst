# Rayburst defaults for Aria2 Next.
#
# Only values where the app deliberately differs from the engine defaults are
# listed; user preferences and the managed RPC, session and log options are
# applied on top. See https://github.com/AnInsomniacy/aria2-next

# Checkpoint progress often so a crash or power loss loses little.
state-save-interval=10

# A downloaded .torrent file is saved, never started; the user opens it.
follow-torrent=false

# A finished BitTorrent or ED2K task leaves the active slots while sharing.
detach-share-only=true

# Retry stalled and failing downloads indefinitely, but give up on a URI that
# keeps answering "not found".
max-tries=0
retry-wait=10
max-file-not-found=10
connect-timeout=10
timeout=10
http-accept-gzip=true

bt-max-peers=128
bt-first-last-piece-first=true
