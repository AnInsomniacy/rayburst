<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rayburst — Redefining the open-source download manager</title>
    <meta
      name="description"
      content="Rayburst is an open-source download manager for files, torrents and live streams, native on macOS, Windows and Linux."
    />
    <meta name="theme-color" content="#0b0910" />
    <meta property="og:title" content="Rayburst" />
    <meta property="og:description" content="Redefining the open-source download manager" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rayburst.pages.dev/" />
    <meta property="og:image" content="https://rayburst.pages.dev/og.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Rayburst — Redefining the open-source download manager" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <style>
      html {
        background: #0b0910;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        background: #fbf8fd;
        color-scheme: light;
      }
    </style>
    <!-- Theme before first paint; the app keeps it in sync afterwards. -->
    <script>
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem('rayburst-website-theme')
        } catch {
          // Storage is optional; the system preference still applies.
        }
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p
        style="
          font:
            16px/1.6 system-ui,
            sans-serif;
          text-align: center;
          padding: 48px 24px;
        "
      >
        Rayburst — Redefining the open-source download manager.
        <a href="https://github.com/AnInsomniacy/rayburst/releases">Download on GitHub</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
