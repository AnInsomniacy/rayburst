name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Icon Composer's asset runtime needs the macOS 26 build environment.
          - platform: macos-26
            args: --target aarch64-apple-darwin
            label: macos-aarch64
          - platform: macos-26-intel
            args: --target x86_64-apple-darwin
            label: macos-x86_64
          - platform: windows-2025-vs2026
            args: --target x86_64-pc-windows-msvc --bundles nsis
            label: windows-x86_64
          - platform: windows-2025-vs2026
            args: --target aarch64-pc-windows-msvc --bundles nsis
            label: windows-aarch64
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: ubuntu-22.04-arm
            args: --target aarch64-unknown-linux-gnu
            label: linux-aarch64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Select Xcode for Icon Composer
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - uses: dtolnay/rust-toolchain@stable

      # Cross-compilation: add the secondary Rust target when building for
      # a different architecture on the same OS runner.
      # - macOS x86_64 uses a native Intel runner, no cross-compile needed.
      # - Windows ARM64 cross-compiles on x64 runner (NSIS is arch-agnostic).
      - name: Add cross-compilation target
        if: contains(matrix.args, 'aarch64-pc-windows-msvc')
        shell: bash
        run: |
          TARGET=$(echo '${{ matrix.args }}' | sed 's/.*--target \([^ ]*\).*/\1/')
          rustup target add "$TARGET"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Suppress needrestart daemon (auto-restarts services on package
      # install, can kill the runner agent and cause "operation canceled").
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          export NEEDRESTART_SUSPEND=1
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo -E apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - run: pnpm install --frozen-lockfile

      # A prerelease RPM gets its own version and release (see rpm-version.sh),
      # which tauri build cannot set without changing the app's version, so it
      # is bundled separately after the build.
      - name: Plan the prerelease RPM
        id: rpm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          RPM=$(.github/scripts/rpm-version.sh "$VERSION")
          if [ "$RPM" != "$VERSION-1" ]; then
            {
              echo "version=$VERSION"
              echo "rpm=$RPM"
              echo "config={\"version\":\"${RPM%%-*}\",\"bundle\":{\"linux\":{\"rpm\":{\"release\":\"${RPM#*-}\"}}}}"
              echo "bundles=--bundles deb,appimage"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The AppImage must use the host's Wayland libraries: a bundled copy
          # from the build machine breaks EGL on newer Mesa and the window
          # never opens (#714). linuxdeploy leaves out libwayland-client
          # itself; this list (separated by ';') covers the rest.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: libwayland-*
        with:
          tagName: ${{ github.event.release.tag_name || '' }}
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          includeUpdaterJson: false
          args: ${{ matrix.args }} ${{ steps.rpm.outputs.bundles }} --config src-tauri/tauri.release.json

      - name: Bundle the prerelease RPM
        if: steps.rpm.outputs.config
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TARGET=$(echo '${{ matrix.args }}' | sed 's/.*--target \([^ ]*\).*/\1/')
          pnpm tauri bundle --target "$TARGET" --bundles rpm \
            --config src-tauri/tauri.release.json --config '${{ steps.rpm.outputs.config }}'
          RPM="src-tauri/target/$TARGET/release/bundle/rpm/Rayburst-${{ steps.rpm.outputs.rpm }}.${TARGET%%-*}.rpm"
          # The updater checks the signed version against the app's, not the RPM's.
          pnpm tauri signer sign --app-version '${{ steps.rpm.outputs.version }}' "$RPM"
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" "$RPM" "$RPM.sig" --clobber
          fi

      # The installer runs rayburst.exe from its temporary directory, and the
      # browser starts the launcher; neither may need the Visual C++
      # Redistributable (#756). A dynamically linked runtime leaves its DLL
      # names in the import table.
      - name: Check Windows runtime linkage
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TARGET=$(echo '${{ matrix.args }}' | sed 's/.*--target \([^ ]*\).*/\1/')
          for path in "src-tauri/target/$TARGET/release/rayburst.exe" \
            "src-tauri/generated-binaries/rayburst-browser-launcher-$TARGET.exe"; do
            test -f "$path"
            if grep -aqiE 'vcruntime140|msvcp140' "$path"; then
              echo "::error file=src-tauri/.cargo/config.toml::$path links the Visual C++ runtime dynamically"
              exit 1
            fi
          done

      - name: Upload build artifacts (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: rayburst-${{ matrix.label }}
          path: "${{ join(fromJSON(steps.tauri.outputs.artifactPaths), '\n') }}\nsrc-tauri/target/*/release/bundle/rpm/*.rpm*"
          retention-days: 7

  merge-updater-json:
    needs: build
    runs-on: ubuntu-latest
    # Signed Windows packages must be final before the update channel changes.
    if: github.event_name == 'release' && vars.SIGNPATH_ENABLED != 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Generate and upload channel-specific updater JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/refresh-updater-json.sh "${{ github.event.release.tag_name }}"

  update-homebrew:
    needs: build
    runs-on: macos-15
    if: github.event_name == 'release' && !github.event.release.prerelease && vars.HOMEBREW_ENABLED == 'true'
    concurrency:
      group: homebrew-rayburst
      cancel-in-progress: false
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

    steps:
      - name: Update the Rayburst cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          gh auth setup-git --hostname github.com
          brew tap AnInsomniacy/rayburst
          TAP_DIR="$(brew --repository AnInsomniacy/rayburst)"
          CURRENT="$(brew info --json=v2 --cask AnInsomniacy/rayburst/rayburst | jq -r '.casks[0].version')"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Rayburst $VERSION is already in the tap."
            exit 0
          fi

          brew bump-cask-pr --write-only --no-audit \
            --version="$VERSION" \
            AnInsomniacy/rayburst/rayburst
          git -C "$TAP_DIR" diff --check
          git -C "$TAP_DIR" config user.name "github-actions[bot]"
          git -C "$TAP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_DIR" add Casks/rayburst.rb
          git -C "$TAP_DIR" commit -m "rayburst $VERSION"
          git -C "$TAP_DIR" push origin HEAD:main
